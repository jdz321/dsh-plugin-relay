# Publish to npm on a version tag (v*) or a manual dispatch.
#
# One-time setup (docs/PUBLISHING.md §9):
#   1. npmjs.com → granular access token (read & write) → repo secret NPM_TOKEN.
#   2. Push a tag: git tag v0.5.1 && git push origin v0.5.1
# The tag/version guard fails runs whose tag does not match package.json —
# pushing the historical v0.5.0 tag therefore fails fast by design.

name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance attestation (works alongside NPM_TOKEN)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      # build-shape tests read the lib/ artifacts, so build must precede test.
      - run: npm run build
      - run: npm test

      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
